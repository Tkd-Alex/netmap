<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netmap</title><style>
:root{color-scheme:dark;--bg:#0a101b;--panel:#111b2a;--panel2:#162337;--line:#263950;--text:#e8f0fc;--muted:#92a5be;--blue:#68b7ff;--green:#61d6a4;--amber:#ffc76a;--red:#ff8282;--violet:#d4b7ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#152c45,var(--bg) 60%);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
main{max-width:1440px;margin:auto;padding:30px 34px 60px}
h1,h2,h3,p{margin:0}h1{font-size:20px;letter-spacing:-.3px}
.muted,.sub,.footer{color:var(--muted)}.sub,.footer{font-size:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:42px;height:42px;border:1px solid #376087;background:linear-gradient(145deg,#183450,#102133);border-radius:13px;display:grid;place-items:center;color:var(--blue);font-size:22px}
button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
button{cursor:pointer;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:#50739a;background:var(--panel2)}button:disabled{opacity:.6;cursor:progress}
.primary{background:#173a58;border-color:#28618e}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}
.stat,.panel{background:linear-gradient(145deg,rgba(19,31,48,.97),rgba(14,24,38,.97));border:1px solid var(--line);border-radius:15px}
.stat{padding:16px 19px}.stat label{color:var(--muted);font-size:12px}
.num{font-size:26px;font-weight:650;margin-top:2px}.stat small{color:var(--muted)}
.notices{display:grid;gap:8px;margin:10px 0}
.notice{padding:10px 13px;border-radius:9px;border:1px solid #6a3b3b;background:#351e25;color:#ffb5ae;overflow-wrap:anywhere}
.notice.warn{border-color:#73562c;background:#302719;color:#ffda97}
.notice.info{border-color:#2b5676;background:#132b40;color:#b8dcff}
.panel{padding:20px;margin-top:15px}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.panel-head h2{font-size:15px;font-weight:600;flex:1}.panel-head input{min-width:220px}
.topology{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.router{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:22px}
.node{min-width:230px;text-align:center;background:#132b40;border:1px solid #2b5676;padding:14px 18px;border-radius:13px}
.node.opalnode{background:#2c2439;border-color:#5c4c7a;cursor:pointer}
.node-title{font-weight:650;font-size:15px}.node small{display:block;color:var(--muted);margin-top:3px}
.arrow{color:#58718c;font-size:19px}
.group{background:rgba(15,26,41,.8);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.group h3,.group summary{font-size:13px;margin-bottom:11px}.group summary{cursor:pointer;margin:0}.group[open] summary{margin-bottom:11px}
.group h3 span,.group summary span{color:var(--muted);font-weight:400}
.g-ax{border-top:2px solid #4488bd}.g-opal{border-top:2px solid #a78bd3}.g-wired{border-top:2px solid #60c99c}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.device{padding:10px;background:#111d2b;border:1px solid #26374b;border-radius:9px;min-width:0;cursor:pointer}
.device:hover{border-color:#47688c}.device.off{opacity:.6}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.rssi{font-size:12px;font-weight:600;white-space:nowrap}
.good{color:var(--green)}.mid{color:var(--amber)}.bad{color:var(--red)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #233348}
th{white-space:nowrap}th button{border:0;background:none;padding:0;color:var(--muted);font-size:12px}
th button:hover:not(:disabled){background:none;color:var(--text)}
tbody tr{cursor:pointer}tbody tr:hover{background:#142237}tr.off td{color:var(--muted)}
.mono{font:12px ui-monospace,SFMono-Regular,monospace}
.rename{padding:2px 7px}
.chart-box{position:relative}.chart{width:100%;height:200px;display:block}
.tip{position:absolute;pointer-events:none;background:#0a101b;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12px;white-space:nowrap}
.ranges{display:flex;gap:6px}.ranges button{padding:5px 10px}.ranges button[aria-pressed=true]{background:#173a58;border-color:#28618e}
.empty{color:var(--muted);padding:10px}
.panel>summary{cursor:pointer;font-size:15px;font-weight:600}.panel[open]>summary{margin-bottom:15px}.panel>summary span{font-weight:400}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(5,9,15,.7)}dialog input,dialog select{width:100%}.ic{width:15px;height:15px;margin-right:6px;vertical-align:-3px;color:var(--blue);flex:none}.ic.auto{opacity:.5}.ic.none{color:var(--muted)}
.fld{display:grid;gap:4px;margin:12px 0 0;color:var(--muted);font-size:12px}dialog h3{margin-bottom:4px}dialog menu{margin-top:16px!important}
dialog menu{display:flex;justify-content:flex-end;gap:8px;margin:0;padding:0}
@media(max-width:800px){main{padding:18px 14px 40px}.stats{grid-template-columns:repeat(2,1fr)}.topology{grid-template-columns:1fr}.router{grid-column:auto;flex-direction:column;gap:7px}.arrow{transform:rotate(90deg)}.node{width:100%}.panel{padding:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

$('evPanel').addEventListener('toggle',()=>{if($('evPanel').open)loadEvents()});
$('evRanges').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;evHours=+b.dataset.h;document.querySelectorAll('#evRanges button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));loadEvents()});
$('closeHistory').addEventListener('click',()=>$('historyPanel').hidden=true);
$('refreshBtn').addEventListener('click',refreshNow);
$('typeFilter').addEventListener('change',drawTable);$('roomFilter').addEventListener('change',drawTable);$('applySug').addEventListener('click',applySuggestions);
$('editHist').addEventListener('click',()=>{if(hist.mac&&hist.mac!=='opal:uplink')openEdit(hist.mac)});
$('viewSel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;VIEW=b.dataset.v;try{localStorage.setItem('view',VIEW)}catch(x){}syncView();drawTopology()});
$('langSel').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.l!==LANG)setLang(b.dataset.l)});
$('dlgCancel').addEventListener('click',()=>$('dlg').close('cancel'));
$('dlg').addEventListener('close',()=>{if($('dlg').returnValue==='ok')saveEdit()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
applyStatic();syncView();syncRanges();
refresh();setInterval(()=>{if(!document.hidden)refresh()},POLL);
</script></body></html>
