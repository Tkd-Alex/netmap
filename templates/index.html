<header><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><defs><linearGradient id="brandGradient" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#007BFF"/><stop offset=".56" stop-color="#00BDFB"/><stop offset="1" stop-color="#00E676"/></linearGradient></defs><path d="M24 28V72M24 28L56 72M38 18L76 56M76 28V56" stroke="url(#brandGradient)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="url(#brandGradient)"><circle cx="24" cy="28" r="8.8"/><circle cx="24" cy="72" r="8.8"/><circle cx="56" cy="72" r="8.8"/><circle cx="38" cy="18" r="8.8"/><circle cx="76" cy="28" r="8.8"/><circle cx="76" cy="56" r="8.8"/></g></svg></div><div class="brand-copy"><h1 class="wordmark"><span class="net">Net</span><span class="map">map</span></h1><div class="brand-payoff">Your network, at a glance</div><div class="brand-sub" id="sub"></div></div></div><div class="header-actions"><div class="ranges" id="langSel" role="group" data-ia="langAria"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div><button type="button" id="themeToggle" data-ia="themeAria" aria-pressed="false"></button><span class="updated-pill" id="updated" data-i="waiting"></span><button class="primary" id="refreshBtn" type="button"><svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.9 9A7.5 7.5 0 0 1 18 5.5L20 7M4 17v-5h5"/><path d="M19.1 15A7.5 7.5 0 0 1 6 18.5L4 17"/></svg><span class="refresh-label" id="refreshLabel" data-i="refresh"></span></button></div></header>
<section class="stats" data-ia="summaryAria">
<div class="stat"><label data-i="statConnected"></label><div class="num" id="count">—</div><small id="countSub">&nbsp;</small></div>
<div class="stat"><label data-i="statDirect"></label><div class="num" id="axcount">—</div><small data-i="statDirectSub"></small></div>
<div class="stat"><label data-i="statOpal"></label><div class="num" id="opcount">—</div><small id="opSub">&nbsp;</small></div>
<div class="stat"><label data-i="statUplink"></label><div class="num" id="uplinkNum">—</div><small id="uplinkSub">&nbsp;</small></div></section>
<div id="errors" class="notices" role="status"></div><div id="alerts" class="notices"></div>
<section class="panel"><div class="panel-head"><h2 data-i="topoTitle"></h2><div class="ranges" id="viewSel" role="group" data-ia="groupBy"><button type="button" data-v="net" data-i="vNet"></button><button type="button" data-v="room" data-i="vRoom"></button><button type="button" data-v="kind" data-i="vKind"></button></div></div><div id="topology" class="topology"><div class="empty" data-i="topoLoading"></div></div></section>
<section class="panel"><div class="panel-head"><h2 data-i="allDevices"></h2>
<input id="filter" type="search" data-iph="filterPh" data-ia="filterAria">
<select id="connectionFilter" data-ia="connFilterAria"><option value="all" data-i="optAllStates"></option><option value="connected" data-i="optConnected"></option><option value="disconnected" data-i="optDisconnected"></option></select>
<select id="typeFilter" data-ia="typeFilterAria"></select><select id="roomFilter" data-ia="roomFilterAria"></select>
<button id="unlabeled" type="button" aria-pressed="false"></button><button id="clearFilters" type="button" data-i="clearFilters" title="Reset search and filters"></button><button id="applySug" type="button" class="primary" hidden></button><span class="footer" id="shown"></span></div>
<div class="table-wrap"><table><thead><tr id="head"><th aria-sort="none"><button type="button" data-k="name" data-i="thLabel"></button></th><th aria-sort="none"><button type="button" data-k="status" data-i="thStatus"></button></th><th aria-sort="none"><button type="button" data-k="ip">IP</button></th><th aria-sort="none"><button type="button" data-k="mac">MAC</button></th><th aria-sort="none"><button type="button" data-k="kind" data-i="thType"></button></th><th aria-sort="none"><button type="button" data-k="room" data-i="thRoom"></button></th><th aria-sort="none"><button type="button" data-k="ap" data-i="thLink"></button></th><th aria-sort="none"><button type="button" data-k="band" data-i="thBand"></button></th><th aria-sort="none"><button type="button" data-k="ssid">SSID</button></th><th aria-sort="none"><button type="button" data-k="rssi">RSSI</button></th><th aria-sort="none" title="TX Mbps"><button type="button" data-k="tx" data-i="thTx"></button></th><th aria-sort="none" title="RX Mbps"><button type="button" data-k="rx" data-i="thRx"></button></th></tr></thead><tbody id="rows"></tbody></table></div><p class="table-scroll-hint" data-i="tableScrollHint"></p></section>
<section class="panel" id="historyPanel" hidden><div class="panel-head"><h2 id="historyTitle"></h2>
<div class="ranges" id="ranges"><button type="button" data-h="1">1 h</button><button type="button" data-h="6">6 h</button><button type="button" data-h="24">24 h</button><button type="button" data-h="168" data-i="r7d"></button></div>
<button type="button" id="editHist" data-i="btnEdit"></button><button type="button" id="closeHistory" data-i="btnClose"></button></div>
<p class="footer" style="margin:-6px 0 10px" data-i="chartLegend"></p>
<div class="chart-box"><canvas id="chart" class="chart" role="img" data-ia="chartAria"></canvas><div class="tip" id="tip" hidden></div></div></section>
<details class="panel" id="evPanel"><summary><span data-i="evTitle"></span> <span class="footer" id="evSum"></span></summary>
<div class="panel-head"><span class="footer" style="flex:1" data-i="evIntro"></span><div class="ranges" id="evRanges"><button type="button" data-h="24" aria-pressed="true">24 h</button><button type="button" data-h="168" data-i="r7d"></button></div></div>
<div class="table-wrap"><table style="min-width:520px"><thead><tr><th data-i="thUnstable"></th><th data-i="thApChanges"></th><th data-i="thBandChanges"></th><th data-i="thDisc"></th></tr></thead><tbody id="evTop"></tbody></table></div>
<div class="table-wrap" style="margin-top:14px;max-height:360px"><table style="min-width:620px"><thead><tr><th data-i="thWhen"></th><th data-i="thDevice"></th><th data-i="thEvent"></th><th data-i="thFromTo"></th></tr></thead><tbody id="evList"></tbody></table></div>
<p class="footer" style="margin-top:10px" data-i="evNote"></p></details>
<details class="panel" id="diag"><summary><span data-i="diagTitle"></span> <span class="footer" id="diagSum"></span></summary>
<div class="table-wrap"><table style="min-width:680px"><thead><tr><th data-i="thSource"></th><th data-i="thState"></th><th data-i="thLastOk"></th><th data-i="thDuration"></th><th data-i="thLastReading"></th><th data-i="thFails"></th></tr></thead><tbody id="diagRows"></tbody></table></div>
<p class="footer" id="diagFoot" style="margin-top:10px"></p></details>
<p class="footer" style="margin:16px 3px"><span data-i="lastUpdate"></span> <span id="fulltime">—</span> <span data-i="sqliteNote"></span></p>
<dialog id="dlg"><form method="dialog" id="renameForm"><h3 data-i="dlgTitle"></h3><div class="mono muted" id="dlgMac"></div>
<label class="fld"><span data-i="fName"></span><input id="dlgName" maxlength="80" autocomplete="off" data-iph="namePh"></label>
<label class="fld"><span data-i="fType"></span><select id="dlgKind"></select></label><div class="footer" id="dlgHint"></div>
<label class="fld"><span data-i="fRoom"></span><input id="dlgRoom" list="roomList" maxlength="40" autocomplete="off" data-iph="roomPh"></label><datalist id="roomList"></datalist>
<menu><button type="button" id="dlgCancel" data-i="cancel"></button><button class="primary" value="ok" data-i="save"></button></menu></form></dialog><div id="toast" role="status" aria-live="polite" data-show="false"></div></main>
<script src="{{ url_for('static', filename='js/netmap.js', v=asset_v) }}" defer></script></body></html>
